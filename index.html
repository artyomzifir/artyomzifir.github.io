<!doctype html>
<html lang="en" data-mode="hard" data-lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Artyom Tuzov</title>
<meta name="description" content="ML/CV Engineer specializing in robotics. Champion of Russia in robotics programming."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!--
  All families requested with cyrillic subset so RU and EN render in identical typefaces.
  JetBrains Mono replaces Azeret Mono (Azeret Mono has no Cyrillic glyphs on Google Fonts).
  Comfortaa includes Cyrillic since 2018.
-->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

<!-- Frosted background gradient layers (positioned behind everything) -->
<div class="bg-gradient" aria-hidden="true">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
</div>

<nav class="topbar">
  <div class="topbar-inner">
    <span class="logo">AT</span>
    <div class="topbar-right">
      <div class="nav-links">
        <a href="#skills"     id="nav-skills">Skills</a>
        <a href="#education"  id="nav-edu">Education</a>
        <a href="#experience" id="nav-exp">Experience</a>
        <a href="#projects"   id="nav-proj">Projects</a>
        <a href="#awards"     id="nav-awards">Awards</a>
      </div>
      <button class="lang-toggle" onclick="toggleLang()">
        <span class="lang-current">EN</span>
      </button>
      <div class="mode-toggle" onclick="toggleMode()">
        <div class="toggle-track">
          <span class="toggle-pill" aria-hidden="true"></span>
          <span class="toggle-label hard-label">Hard</span>
          <span class="toggle-label soft-label">Soft</span>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="hero fi">
    <div class="hero-grid">
      <div class="hero-av-wrap">
        <div class="hero-av" id="hero-av"><div class="av-placeholder">AT</div></div>
        <div class="av-ring"></div>
      </div>
      <div class="hero-content">
        <div class="hero-eyebrow" id="hero-eyebrow"></div>
        <h1 class="hero-name">Artyom Tuzov</h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <p class="hero-pitch" id="hero-pitch"></p>
        <div class="langs-row" id="langs-row"></div>
      </div>
    </div>
  </header>

  <!-- Contacts + CV strip -->
  <div class="contacts-strip" id="contacts-strip"></div>

  <div class="stats" id="stats"></div>

  <main>

    <section id="skills" data-section="skills">
      <div class="section-head">
        <span class="section-num">01</span>
        <h2 class="section-title" id="skills-title">Skills</h2>
        <div class="section-line"></div>
      </div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section id="education" data-section="education">
      <div class="section-head">
        <span class="section-num">02</span>
        <h2 class="section-title" id="edu-title">Education</h2>
        <div class="section-line"></div>
      </div>
      <div id="edu-content"></div>
    </section>

    <section id="experience" data-section="experience">
      <div class="section-head">
        <span class="section-num">03</span>
        <h2 class="section-title" id="exp-title">Experience</h2>
        <div class="section-line"></div>
      </div>
      <div id="exp-list"></div>
    </section>

    <section id="projects" data-section="projects">
      <div class="section-head">
        <span class="section-num">04</span>
        <h2 class="section-title" id="proj-title">Projects</h2>
        <div class="section-line"></div>
      </div>
      <div id="proj-list"></div>
    </section>

    <section id="awards" data-section="awards">
      <div class="section-head">
        <span class="section-num">05</span>
        <h2 class="section-title" id="awards-title">Awards & Achievements</h2>
        <div class="section-line"></div>
      </div>
      <div class="awards-list" id="awards-list"></div>
    </section>

  </main>
</div>

<footer class="footer">
  <div class="wrap" id="footer-text">Artyom Tuzov · Kazan / Innopolis · open to remote · 2026</div>
</footer>

<script src="config.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/theme.js"></script>
</body>
</html>
