<!doctype html>
<html lang="en" data-mode="hard" data-lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Artyom Tuzov</title>
<meta name="description" content="ML/CV Engineer specializing in robotics. Champion of Russia in robotics programming."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Font URL is set from CONFIG.fonts.google_fonts in render.js, but preloaded here as default -->
<link id="google-fonts" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <span class="logo">AT</span>
    <div class="topbar-right">
      <div class="nav-links">
        <a href="#skills"     id="nav-skills">Skills</a>
        <a href="#education"  id="nav-edu">Education</a>
        <a href="#experience" id="nav-exp">Experience</a>
        <a href="#projects"   id="nav-proj">Projects</a>
        <a href="#awards"     id="nav-awards">Awards</a>
      </div>

      <!-- Lang toggle -->
      <button class="lang-toggle" onclick="toggleLang()" aria-label="Switch language">
        <span class="lang-current">EN</span>
      </button>

      <!-- Mode toggle -->
      <div class="mode-toggle" onclick="toggleMode()">
        <div class="toggle-track">
          <span class="toggle-label hard-label">Hard</span>
          <span class="toggle-knob"></span>
          <span class="toggle-label soft-label">Soft</span>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="hero fi">
    <div class="hero-grid">
      <div class="hero-av-wrap">
        <div class="hero-av" id="hero-av">
          <div class="av-placeholder">AT</div>
        </div>
        <div class="av-ring"></div>
      </div>
      <div class="hero-content">
        <div class="hero-eyebrow" id="hero-eyebrow"></div>
        <h1 class="hero-name">Artyom Tuzov</h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <p class="hero-pitch" id="hero-pitch"></p>
        <div class="hero-contacts" id="hero-contacts"></div>
        <div class="hero-cta" id="hero-cta"></div>
        <div class="langs-row" id="langs-row"></div>
      </div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <main>

    <section id="skills">
      <div class="section-head">
        <span class="section-num">01</span>
        <h2 class="section-title" id="skills-title">Skills</h2>
        <div class="section-line"></div>
      </div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section id="education">
      <div class="section-head">
        <span class="section-num">02</span>
        <h2 class="section-title" id="edu-title">Education</h2>
        <div class="section-line"></div>
      </div>
      <div id="edu-content"></div>
    </section>

    <section id="experience">
      <div class="section-head">
        <span class="section-num">03</span>
        <h2 class="section-title" id="exp-title">Experience</h2>
        <div class="section-line"></div>
      </div>
      <div id="exp-list"></div>
    </section>

    <section id="projects">
      <div class="section-head">
        <span class="section-num">04</span>
        <h2 class="section-title" id="proj-title">Projects</h2>
        <div class="section-line"></div>
      </div>
      <div id="proj-list"></div>
    </section>

    <section id="awards">
      <div class="section-head">
        <span class="section-num">05</span>
        <h2 class="section-title" id="awards-title">Awards & Achievements</h2>
        <div class="section-line"></div>
      </div>
      <div class="awards-list" id="awards-list"></div>
    </section>

  </main>
</div>

<footer class="footer">
  <div class="wrap" id="footer-text">Artyom Tuzov · Kazan / Innopolis · open to remote · 2026</div>
</footer>

<script src="config.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/theme.js"></script>

<script>
// Update lang button and nav labels on toggle
const _origToggleLang = toggleLang;
function toggleLang() {
  _origToggleLang();
  document.querySelector('.lang-current').textContent = STATE.lang.toUpperCase();
  const navLabels = {
    en: ['Skills','Education','Experience','Projects','Awards'],
    ru: ['Навыки','Образование','Опыт','Проекты','Достижения']
  };
  const ids = ['nav-skills','nav-edu','nav-exp','nav-proj','nav-awards'];
  const labels = navLabels[STATE.lang] || navLabels.en;
  ids.forEach((id, i) => {
    const el = document.getElementById(id);
    if (el) el.textContent = labels[i];
  });
  const ftEl = document.getElementById('footer-text');
  if (ftEl) ftEl.textContent = STATE.lang === 'ru'
    ? 'Артём Тузов · Казань / Иннополис · открыт к удалённой работе · 2026'
    : 'Artyom Tuzov · Kazan / Innopolis · open to remote · 2026';
}
</script>

</body>
</html>
