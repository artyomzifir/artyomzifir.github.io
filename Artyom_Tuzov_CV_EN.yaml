# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
cv:
  name: Artyom Tuzov
  headline: ML Engineer
  email: a.tuzov.work@mail.ru
  phone: "+7-987-220-1639"
  social_networks:
    - network: GitHub
      username: artyomzifir
    - network: Telegram
      username: artyomzifir

  sections:
    Summary:
      - "I work in machine learning and robotics and at the intersection of the
        two. I take applied ML tasks end to end: from data and experiments to a
        working service handed over to a product team. Topics: robotics,
        computer vision, agentic systems, NLP, RAG and search systems. Stack:
        Python, C++, PyTorch."

    Education:
      - institution: Innopolis University
        area: "BSc 3+1, Data Science and AI, robotics track. GPA 4.83 / 5.0, thesis in progress"
        location: Innopolis
        start_date: 2023-09
        end_date: 2027-06

    Experience:
      - company: MWS RnD
        position: Research Engineer, internship, full-time, hybrid
        location: Innopolis
        start_date: 2026-06
        end_date: present
        highlights:
          - "Reworked hybrid search in a live project: fusion of the lexical and
            vector parts, a reranker, an eval loop on RAGBench over recall@k,
            MRR@10 and nDCG@10"
          - "Full-cycle applied research: from picking a topic and reproducing
            published results to a demo handed over to an internal owner"
          - "Domains: LLM, NLP, RAG, search systems, agentic systems"

      - company: Innopolis University
        position: Instructor, Professional Development Course, contract,
          on-site
        location: Kazan
        start_date: 2026-07
        end_date: 2026-08
        highlights:
          - 'Built the materials for a 72-hour course "AI Systems Specialist"
            from scratch for 20 students: applied Python and data work,
            generative models, fine-tuning and services on top of them'
          - Taught on site and over video, ran the final assessment

      - company: Innopolis University
        position: Robotics Software Engineer, half-time staff and project
          contracts, on-site
        location: Innopolis
        start_date: 2025-09
        end_date: 2026-06
        highlights:
          - "**[LLM swarm](https://github.com/Innopolis-Robotics-Society/llm_swarm):**
            coordination of a 20 robot swarm on ROS 2 Humble, a MAPF planner and
            Nav2 driven by BehaviorTree. My part: the upper control layer and the
            harness around the LLM advisory channels, test scenarios and model
            benchmarking"
          - "**[PCB assembly inspection](https://github.com/Innopolis-Robotics-Society/robot-assistants):**
            pcb_inspector ROS2 node: component detection and geometry report
            against a baseline; 12-class dataset, YOLO11s up to mAP50 0.964 at
            15.1 ms on RTX 3050m"
          - "**[Unitree A1 robot dog](https://github.com/Innopolis-Robotics-Society/project_fabian):**
            ROS2 perception pipeline: YOLO11 pose via ONNX Runtime CUDA, IoU
            tracking, tuned for Jetson Orin Nano 4GB up to 15 FPS end-to-end"

      - company: Yandex Cloud
        position: ML Engineer, contract, remote
        location: Remote
        start_date: 2025-12
        end_date: 2026-03
        highlights:
          - "Built an image classification service trained on soft labels:
            dataset assembly and balancing, CNN backbone benchmark, release. The
            service shipped to production"
          - "Worked with noisy soft labels on a review scoring task: hunted
            labelling anomalies and kept QWK under control under heavy class
            imbalance"

    Awards:
      - name: "[2nd place, Future of Medicine case championship](https://github.com/artyomzifir/artyomzifir.github.io/blob/main/artifacts/technical-achievements/future-medicine-diffuse-tomography-second-degree-2026.pdf)"
        date: 2026-10
        highlights:
          - "Team solution: a TD-DOT pipeline for stroke classification, optode
            layout reconstruction, and lesion location, depth and volume estimation"
      - name: "[2nd place, Tenderhack](https://github.com/artyomzifir/artyomzifir.github.io/blob/main/artifacts/technical-achievements/tender-hack-second-place-2026.pdf)"
        date: 2026-03
        highlights:
          - "Matching comparable goods for initial procurement price estimation:
            BM25, embeddings, ranking"
      - name: "[1st place, Russian Championship in Robotics Programming](https://github.com/artyomzifir/artyomzifir.github.io/blob/main/artifacts/technical-achievements/russian-robotics-programming-championship-first-place-results-2025.pdf)"
        date: 2025-12
        highlights:
          - "Russian Federation of Sport Programming. Finals: five applied
            automation tasks on Promobot M Edu manipulators, 13 teams from 8
            regions"

    Projects:
      - name: "[ViKi](https://github.com/artyomzifir/ViKi)"
        start_date: 2026-05
        end_date: present
        highlights:
          - "Diploma research project: a vision-to-kinematics pipeline for
            imitation learning on a robot manipulator"
          - Multi-camera RGB-D capture of demonstrations, pose estimation and
            retargeting onto robot kinematics

    Leadership:
      - bullet: "**[Innopolis Robotics Society](https://github.com/Innopolis-Robotics-Society)**,
          co-founder of a student robotics community: we put teams together for
          hackathons and championships, run projects and mentor first-year
          students"
      - bullet: "Young && Yandex ambassador, top 60 out of 7000+ applications;
          organised an internal hackathon for 70+ participants"

    Skills:
      - label: Robotics / CV
        details: ROS2, Nav2, BehaviorTree, Gazebo, MuJoCo, Stage, URDF, OpenCV,
          YOLO, ONNX Runtime, Jetson, CUDA
      - label: ML / NLP
        details: PyTorch, LLM, VLM, RAG, hybrid search, embeddings, ranking,
          fine-tuning
      - label: Systems & Data
        details: Python, C++, Linux, Bash, Docker, Git, NumPy, Pandas,
          scikit-learn
      - label: Languages
        details: Russian, English

design:
  theme: zifir
  page:
    size: a4
    top_margin: "1.0cm"
    bottom_margin: "0.9cm"
    left_margin: "1.4cm"
    right_margin: "1.4cm"
    show_top_note: false
    show_footer: false
  typography:
    line_spacing: "0.72em"
    alignment: justified
    font_family:
      body: Nunito
      connections: Nunito
      name: Montserrat
      headline: Montserrat
      section_titles: Montserrat
    font_size:
      body: "8.6pt"
      name: "21pt"
      headline: "9.5pt"
      connections: "9pt"
      section_titles: "1.15em"
    small_caps:
      name: false
      headline: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  colors:
    body: rgb(26, 26, 25)
    name: rgb(49, 81, 30)
    headline: rgb(49, 81, 30)
    connections: rgb(49, 81, 30)
    section_titles: rgb(49, 81, 30)
    links: rgb(49, 81, 30)
  header:
    alignment: left
    space_below_name: "0.32cm"
    space_below_headline: "0.15cm"
    space_below_connections: "0.2cm"
    connections:
      separator: "|"
      show_icons: false
      display_urls_instead_of_usernames: true
      phone_number_format: international
  links:
    underline: true
    show_external_link_icon: false
  section_titles:
    type: with_full_line
    line_thickness: "0.06cm"
    space_above: "0.18cm"
    space_below: "0.08cm"
  sections:
    space_between_regular_entries: "0.44em"
    space_between_text_based_entries: "0.15em"
    show_time_spans_in: []
  entries:
    short_second_row: false
    side_space: "0cm"
    highlights:
      space_between_items: "0.12cm"
  templates:
    experience_entry:
      main_column: "**COMPANY**\n*POSITION*\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    normal_entry:
      main_column: "**NAME**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    education_entry:
      main_column: "**INSTITUTION**\nDEGREE_WITH_AREA\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: null

locale:
  language: english

settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    typst_path: OUTPUT_FOLDER/Artyom_Tuzov_CV_EN.typ
    pdf_path: OUTPUT_FOLDER/Artyom_Tuzov_CV_EN.pdf
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
  pdf_title: Artyom Tuzov, CV